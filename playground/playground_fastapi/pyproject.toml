[[source]]
url = "https://pypi.org/simple"
verify_ssl = true
name = "pypi"

[project]
name = "try_fastapi"
version = "0.1.0"
description = "A FastAPI project"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic[email]",
  "python-multipart",
]

[tool.uv]
dev-dependencies = [
  "ruff"
]

[scripts]
start = "uvicorn main:app --reload"

[tool.ruff.lint.flake8-bugbear]
# FastAPI の依存宣言（引数デフォルトでの呼び出し）は B008 の対象外にする
extend-immutable-calls = ["fastapi.Body", "fastapi.File", "fastapi.Header", "fastapi.Query"]
